name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: DSH ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both versions in `testedRuntimeVersions`; the runner refuses anything else.
        runtime: ['0.2.0-rc.2', '0.2.1-rc.2']
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: test/pnpm-lock.yaml

      # The suite is hermetic: real Cordis and React in-process, temp directories for every profile.
      - name: Install
        run: pnpm install --ignore-workspace --ignore-scripts --frozen-lockfile

      - name: Test
        env:
          DSH_TEST_RUNTIME_VERSION: ${{ matrix.runtime }}
        run: node run.mjs
